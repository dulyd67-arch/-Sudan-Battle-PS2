name: Build PS2 ELF

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PS2SDK Env
        shell: bash
        run: |
          echo "PS2DEV=/usr/local/ps2dev" >> $GITHUB_ENV
          echo "PS2SDK=/usr/local/ps2dev/ps2sdk" >> $GITHUB_ENV
          echo "/usr/local/ps2dev/bin" >> $GITHUB_PATH
          echo "/usr/local/ps2dev/ps2sdk/bin" >> $GITHUB_PATH

      - name: Build with PS2SDK Makefile
        shell: bash
        run: |
          make clean || true
          make all
          ls -l SUDAN_BATTLE.ELF

      - name: Upload ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SUDAN_BATTLE_PS2_ELF
          path: SUDAN_BATTLE.ELF
          if-no-files-found: error
