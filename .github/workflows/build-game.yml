name: Build PS2 ELF

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile PS2 Binary Direct with EE-GCC
        run: |
          mkdir -p build
          mips64r5900el-ps2-elf-gcc -O2 -G0 -I./src \
            src/main.c \
            src/engine/memory.c \
            src/engine/input.c \
            src/engine/camera.c \
            src/engine/world_stream.c \
            src/render/renderer.c \
            src/physics/collision.c \
            src/gameplay/match.c \
            src/gameplay/combat.c \
            src/gameplay/vehicles.c \
            src/ai/bot_ai.c \
            src/network/lan_net.c \
            src/audio/sound.c \
            src/ui/hud.c \
            -o SUDAN_BATTLE.ELF -lm
          
          ls -la SUDAN_BATTLE.ELF

      - name: Upload ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SUDAN_BATTLE_PS2_ELF
          path: SUDAN_BATTLE.ELF
