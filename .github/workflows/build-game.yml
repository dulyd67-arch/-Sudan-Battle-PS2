name: Build PS2 ELF

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build with PS2SDK Makefile
        run: |
          make clean
          make all

      - name: Upload ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SUDAN_BATTLE_PS2_ELF
          path: SUDAN_BATTLE.ELF
